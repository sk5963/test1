        "개 / 누락 " +
        t.missing +
        "개 / 평균 " +
        (t.mean?.toPrecision(6) || "없음") +

        (t.std?.toPrecision(6) || "없음");
      let s = '<line x1="40" y1="260" x2="880" y2="260" stroke="#ccd5e4"/>';
      t.counts.forEach((v, i) => {
        const w = 830 / t.counts.length;
        const h = (v / max) * 210;
        s += `<rect x="${40 + i * w}" y="${260 - h}" width="${w * 0.85}" height="${h}" fill="#6366f1"><title>${t.edges[i].toPrecision(5)} ~ ${t.edges[i + 1].toPrecision(5)}: ${v}</title></rect>`;
      });
      s += `<text x="40" y="285" font-size="12">${t.edges[0].toPrecision(5)}</text><text x="810" y="285" font-size="12">${t.edges.at(-1).toPrecision(5)}</text>`;
      document.getElementById("chart").innerHTML = s;
    }
    select.onchange = draw;
    draw();
