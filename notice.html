<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무 공지사항</title>
  <!-- SheetJS for xlsx/csv parsing -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    /* Header */
    header {
      background: #1e3a5f;
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
    header span { font-size: 13px; opacity: 0.75; }

    .container {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-left { display: flex; gap: 8px; flex-wrap: wrap; }

    .filter-btn {
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #1e3a5f;
      color: white;
      border-color: #1e3a5f;
    }

    .toolbar-right { display: flex; gap: 8px; align-items: center; }

    .search-box input {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 180px;
    }
    .search-box input:focus { border-color: #1e3a5f; }

    .btn-primary {
      padding: 7px 16px;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #16304f; }

    .btn-outline {
      padding: 7px 14px;
      background: white;
      color: #1e3a5f;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn-outline:hover { background: #f0f5ff; }

    /* File import area */
    .import-bar {
      background: #e8f0fe;
      border: 1px dashed #4a80c4;
      border-radius: 8px;
      padding: 12px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .import-bar span { font-size: 13px; color: #555; }
    .import-bar strong { color: #1e3a5f; }
    #fileInput { display: none; }
    .file-label {
      padding: 6px 14px;
      background: #1e3a5f;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .file-label:hover { background: #16304f; }
    #fileNameDisplay { font-size: 12px; color: #888; }

    /* Notice list */
    .notice-list {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .notice-item {
      display: flex;
      align-items: flex-start;
      padding: 18px 24px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
      gap: 14px;
    }
    .notice-item:last-child { border-bottom: none; }
    .notice-item:hover { background: #f7f9fc; }
    .notice-item.pinned { background: #f0f5ff; border-left: 4px solid #1e3a5f; }

    .badge {
      flex-shrink: 0;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }
    .badge.important { background: #ffe0e0; color: #c0392b; }
    .badge.general   { background: #e0eeff; color: #1e3a5f; }
    .badge.event     { background: #e8f8e8; color: #27ae60; }
    .badge.hr        { background: #fef3cd; color: #b8860b; }

    .notice-content { flex: 1; min-width: 0; }

    .notice-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .notice-title .new-tag {
      font-size: 10px;
      background: #e74c3c;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .notice-meta { font-size: 12px; color: #888; display: flex; gap: 16px; }

    .notice-right {
      flex-shrink: 0;
      text-align: right;
      font-size: 12px;
      color: #aaa;
    }
    .notice-right .date { display: block; margin-bottom: 4px; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; margin-top: 24px; gap: 6px; }
    .page-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .page-btn.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }
    .page-btn:hover:not(.active) { background: #f0f2f5; }

    /* ===== VIEW MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-title-wrap .modal-badge { margin-bottom: 8px; display: inline-block; }
    .modal-title-wrap h2 { font-size: 18px; font-weight: 600; }

    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #888;
      line-height: 1;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 20px 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #444;
    }
    .modal-body p { margin-bottom: 8px; }
    .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 8px; }

    .modal-footer {
      padding: 12px 24px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    /* ===== EDITOR MODAL ===== */
    .editor-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .editor-overlay.open { display: flex; }

    .editor-modal {
      background: white;
      border-radius: 12px;
      width: 92%;
      max-width: 760px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }

    .editor-header {
      padding: 18px 24px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-header h2 { font-size: 17px; font-weight: 600; }

    .editor-fields {
      padding: 20px 24px 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .editor-fields .full { grid-column: 1 / -1; }

    .field-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .field-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .field-input:focus { border-color: #1e3a5f; }

    select.field-input { cursor: pointer; }

    /* Rich text toolbar */
    .rt-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 10px 24px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      border-top: 1px solid #eee;
      margin-top: 16px;
      align-items: center;
    }

    .rt-btn {
      width: 30px;
      height: 28px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .rt-btn:hover { background: #e8eef8; border-color: #1e3a5f; }
    .rt-btn.active { background: #1e3a5f; color: white; border-color: #1e3a5f; }

    .rt-divider {
      width: 1px;
      height: 22px;
      background: #ddd;
      margin: 0 2px;
    }

    .rt-color-btn {
      position: relative;
      width: 30px;
      height: 28px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      background: white;
    }
    .rt-color-btn input[type="color"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .rt-color-icon {
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .color-underline {
      height: 3px;
      width: 18px;
      margin: 0 auto;
      background: #e74c3c;
      border-radius: 1px;
    }

    .rt-select {
      height: 28px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      padding: 0 4px;
      outline: none;
      cursor: pointer;
      background: white;
    }
    .rt-select:focus { border-color: #1e3a5f; }

    .rt-bg-btn {
      position: relative;
      width: 30px;
      height: 28px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      background: white;
    }
    .rt-bg-btn input[type="color"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Editor content area */
    .rt-editor {
      min-height: 200px;
      padding: 16px 24px;
      outline: none;
      font-size: 14px;
      line-height: 1.8;
      color: #333;
    }
    .rt-editor:empty::before {
      content: '공지사항 내용을 입력하세요...';
      color: #bbb;
      pointer-events: none;
    }
    .rt-editor p { margin-bottom: 6px; }
    .rt-editor ul, .rt-editor ol { padding-left: 20px; margin-bottom: 6px; }

    .editor-footer {
      padding: 14px 24px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Empty state */
    .empty-state {
      padding: 60px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>업무 공지사항</h1>
  <span>DEMO v0.2</span>
</header>

<div class="container">

  <!-- File import bar -->
  <div class="import-bar">
    <span><strong>파일에서 불러오기</strong> — xlsx, xls, csv 지원</span>
    <label class="file-label" for="fileInput">파일 선택</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="importFile(this)">
    <span id="fileNameDisplay">파일을 선택하면 자동으로 목록이 갱신됩니다</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="filter-btn active" onclick="filterNotices('all', this)">전체</button>
      <button class="filter-btn" onclick="filterNotices('important', this)">중요</button>
      <button class="filter-btn" onclick="filterNotices('general', this)">일반</button>
      <button class="filter-btn" onclick="filterNotices('hr', this)">인사</button>
      <button class="filter-btn" onclick="filterNotices('event', this)">행사</button>
    </div>
    <div class="toolbar-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="검색..." oninput="applyFilter()">
      </div>
      <button class="btn-primary" onclick="openEditor()">+ 공지 작성</button>
    </div>
  </div>

  <div class="notice-list" id="noticeList"></div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- ===== VIEW MODAL ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="closeViewModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <span class="badge modal-badge" id="modalBadge"></span>
        <h2 id="modalTitle"></h2>
      </div>
      <button class="modal-close" onclick="closeViewModalDirect()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <span id="modalAuthor"></span>
      <span id="modalDate"></span>
    </div>
  </div>
</div>

<!-- ===== EDITOR MODAL ===== -->
<div class="editor-overlay" id="editorOverlay" onclick="closeEditorOverlay(event)">
  <div class="editor-modal">
    <div class="editor-header">
      <h2>공지사항 작성</h2>
      <button class="modal-close" onclick="closeEditor()">&#x2715;</button>
    </div>

    <div class="editor-fields">
      <div>
        <div class="field-label">카테고리</div>
        <select class="field-input" id="edCategory">
          <option value="general">일반</option>
          <option value="important">중요</option>
          <option value="hr">인사</option>
          <option value="event">행사</option>
        </select>
      </div>
      <div>
        <div class="field-label">작성자</div>
        <input class="field-input" id="edAuthor" type="text" placeholder="작성자명">
      </div>
      <div class="full">
        <div class="field-label">제목</div>
        <input class="field-input" id="edTitle" type="text" placeholder="공지사항 제목을 입력하세요">
      </div>
      <div style="display:flex;gap:12px;align-items:center;">
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="edPinned"> 상단 고정
        </label>
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="edNew" checked> NEW 표시
        </label>
      </div>
    </div>

    <!-- Rich text toolbar -->
    <div class="rt-toolbar">
      <!-- Text style -->
      <select class="rt-select" onchange="execCmd('formatBlock', this.value); this.value='p'">
        <option value="p">본문</option>
        <option value="h2">제목 1</option>
        <option value="h3">제목 2</option>
        <option value="h4">제목 3</option>
      </select>

      <select class="rt-select" id="fontSizeSelect" onchange="setFontSize(this.value)">
        <option value="">크기</option>
        <option value="12px">12</option>
        <option value="14px">14</option>
        <option value="16px">16</option>
        <option value="18px">18</option>
        <option value="20px">20</option>
        <option value="24px">24</option>
      </select>

      <div class="rt-divider"></div>

      <button class="rt-btn" title="굵게" onmousedown="e(event,'bold')"><b>B</b></button>
      <button class="rt-btn" title="기울임" onmousedown="e(event,'italic')"><i>I</i></button>
      <button class="rt-btn" title="밑줄" onmousedown="e(event,'underline')"><u>U</u></button>
      <button class="rt-btn" title="취소선" onmousedown="e(event,'strikeThrough')"><s>S</s></button>

      <div class="rt-divider"></div>

      <!-- Text color -->
      <div class="rt-color-btn" title="글자 색상">
        <div class="rt-color-icon">
          A
          <div class="color-underline" id="colorIndicator"></div>
        </div>
        <input type="color" value="#e74c3c" id="textColorPicker" oninput="applyTextColor(this.value)" onchange="applyTextColor(this.value)">
      </div>

      <!-- Highlight color -->
      <div class="rt-bg-btn" title="형광펜">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;pointer-events:none;">
          <span style="background:#ffe066;padding:0 3px;">A</span>
        </div>
        <input type="color" value="#ffe066" id="bgColorPicker" oninput="applyBgColor(this.value)" onchange="applyBgColor(this.value)">
      </div>

      <div class="rt-divider"></div>

      <button class="rt-btn" title="왼쪽 정렬" onmousedown="e(event,'justifyLeft')">&#8676;</button>
      <button class="rt-btn" title="가운데 정렬" onmousedown="e(event,'justifyCenter')">&#8660;</button>
      <button class="rt-btn" title="오른쪽 정렬" onmousedown="e(event,'justifyRight')">&#8677;</button>

      <div class="rt-divider"></div>

      <button class="rt-btn" title="글머리 목록" onmousedown="e(event,'insertUnorderedList')">&#8226;&#8212;</button>
      <button class="rt-btn" title="번호 목록" onmousedown="e(event,'insertOrderedList')">1&#8212;</button>

      <div class="rt-divider"></div>

      <button class="rt-btn" title="서식 지우기" onmousedown="e(event,'removeFormat')" style="font-size:11px;">T&#x2715;</button>
    </div>

    <div class="rt-editor" id="rtEditor" contenteditable="true"></div>

    <div class="editor-footer">
      <button class="btn-outline" onclick="closeEditor()">취소</button>
      <button class="btn-primary" onclick="saveNotice()">공지 등록</button>
    </div>
  </div>
</div>

<script>
  // ===== DATA =====
  const ITEMS_PER_PAGE = 8;
  let notices = [];
  let currentFilter = 'all';
  let currentPage = 1;
  let nextId = 100;

  const categoryLabel = {
    important: ['중요', 'important'],
    general:   ['일반', 'general'],
    event:     ['행사', 'event'],
    hr:        ['인사', 'hr'],
  };

  // ===== FILE IMPORT (xlsx / csv) =====
  function importFile(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById('fileNameDisplay').textContent = file.name + ' 로드 중...';

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        const imported = rows.map((row, i) => ({
          id: nextId++,
          category:  String(row['category'] || 'general').trim(),
          pinned:    String(row['pinned']).toLowerCase() === 'true',
          isNew:     String(row['isNew']).toLowerCase() === 'true',
          title:     String(row['title'] || '(제목 없음)').trim(),
          author:    String(row['author'] || '').trim(),
          date:      String(row['date'] || '').trim(),
          views:     parseInt(row['views']) || 0,
          body:      String(row['body'] || '').trim(),
        }));

        notices = imported;
        currentPage = 1;
        applyFilter();
        document.getElementById('fileNameDisplay').textContent =
          `✅ ${file.name} — ${imported.length}건 불러옴`;
      } catch(err) {
        document.getElementById('fileNameDisplay').textContent = '❌ 파일 읽기 실패: ' + err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ===== RENDER =====
  function renderNotices(list) {
    const container = document.getElementById('noticeList');
    const total = list.length;

    if (total === 0) {
      container.innerHTML = '<div class="empty-state">공지사항이 없습니다.<br>파일을 불러오거나 공지를 직접 작성해보세요.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
    if (currentPage > totalPages) currentPage = 1;
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = list.slice(start, start + ITEMS_PER_PAGE);

    container.innerHTML = pageItems.map(n => {
      const [label, cls] = categoryLabel[n.category] || ['일반', 'general'];
      return `
        <div class="notice-item ${n.pinned ? 'pinned' : ''}" onclick="openViewModal(${n.id})">
          <span class="badge ${cls}">${n.pinned ? '📌 ' : ''}${label}</span>
          <div class="notice-content">
            <div class="notice-title">
              ${escHtml(n.title)}
              ${n.isNew ? '<span class="new-tag">NEW</span>' : ''}
            </div>
            <div class="notice-meta">
              <span>${escHtml(n.author)}</span>
              <span>조회 ${n.views}</span>
            </div>
          </div>
          <div class="notice-right">
            <span class="date">${escHtml(n.date)}</span>
          </div>
        </div>`;
    }).join('');

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})">&lt;</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage + 1})">&gt;</button>`;
    pg.innerHTML = html;
  }

  function goPage(p) {
    const list = getFilteredList();
    const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderNotices(list);
  }

  // ===== FILTER =====
  function getFilteredList() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    let result = [...notices].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    if (currentFilter !== 'all') result = result.filter(n => n.category === currentFilter);
    if (keyword) result = result.filter(n =>
      n.title.toLowerCase().includes(keyword) || n.author.toLowerCase().includes(keyword)
    );
    return result;
  }

  function filterNotices(category, btn) {
    currentFilter = category;
    currentPage = 1;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  }

  function applyFilter() {
    renderNotices(getFilteredList());
  }

  // ===== VIEW MODAL =====
  function openViewModal(id) {
    const n = notices.find(x => x.id === id);
    if (!n) return;
    const [label, cls] = categoryLabel[n.category] || ['일반', 'general'];
    document.getElementById('modalBadge').textContent = label;
    document.getElementById('modalBadge').className = `badge modal-badge ${cls}`;
    document.getElementById('modalTitle').textContent = n.title;
    document.getElementById('modalBody').innerHTML = n.body || '<p>(내용 없음)</p>';
    document.getElementById('modalAuthor').textContent = '작성자: ' + n.author;
    document.getElementById('modalDate').textContent = n.date;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeViewModal(ev) {
    if (ev.target === document.getElementById('modalOverlay')) closeViewModalDirect();
  }
  function closeViewModalDirect() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  // ===== EDITOR =====
  let savedRange = null;

  function openEditor() {
    document.getElementById('edTitle').value = '';
    document.getElementById('edAuthor').value = '';
    document.getElementById('edCategory').value = 'general';
    document.getElementById('edPinned').checked = false;
    document.getElementById('edNew').checked = true;
    document.getElementById('rtEditor').innerHTML = '';
    document.getElementById('editorOverlay').classList.add('open');
    setTimeout(() => document.getElementById('rtEditor').focus(), 100);
  }

  function closeEditor() {
    document.getElementById('editorOverlay').classList.remove('open');
  }

  function closeEditorOverlay(ev) {
    if (ev.target === document.getElementById('editorOverlay')) closeEditor();
  }

  function saveNotice() {
    const title = document.getElementById('edTitle').value.trim();
    if (!title) { alert('제목을 입력해주세요.'); return; }

    const today = new Date();
    const dateStr = today.toISOString().slice(0, 10);

    notices.unshift({
      id: nextId++,
      category: document.getElementById('edCategory').value,
      pinned:   document.getElementById('edPinned').checked,
      isNew:    document.getElementById('edNew').checked,
      title,
      author: document.getElementById('edAuthor').value.trim() || '작성자',
      date: dateStr,
      views: 0,
      body: document.getElementById('rtEditor').innerHTML,
    });

    closeEditor();
    currentPage = 1;
    applyFilter();
  }

  // ===== RICH TEXT COMMANDS =====
  function e(event, cmd) {
    event.preventDefault();
    document.getElementById('rtEditor').focus();
    document.execCommand(cmd, false, null);
  }

  function execCmd(cmd, value) {
    document.getElementById('rtEditor').focus();
    document.execCommand(cmd, false, value);
  }

  function setFontSize(size) {
    if (!size) return;
    saveSelection();
    restoreSelection();
    document.execCommand('fontSize', false, '7');
    // Replace font size with inline style
    const editor = document.getElementById('rtEditor');
    editor.querySelectorAll('font[size="7"]').forEach(el => {
      el.removeAttribute('size');
      el.style.fontSize = size;
    });
  }

  function applyTextColor(color) {
    document.getElementById('colorIndicator').style.background = color;
    saveSelection();
    restoreSelection();
    document.execCommand('foreColor', false, color);
  }

  function applyBgColor(color) {
    saveSelection();
    restoreSelection();
    document.execCommand('hiliteColor', false, color);
  }

  function saveSelection() {
    const sel = window.getSelection();
    if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0);
  }

  function restoreSelection() {
    const editor = document.getElementById('rtEditor');
    editor.focus();
    if (savedRange) {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }
  }

  // Save selection when user clicks toolbar color pickers
  document.addEventListener('DOMContentLoaded', () => {
    const editor = document.getElementById('rtEditor');
    editor.addEventListener('mouseup', saveSelection);
    editor.addEventListener('keyup', saveSelection);
    renderNotices([]);
  });

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
